<style>
  #lrg-output { white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; margin: 0; }
  #lrg-warnbox { border-left: 3px solid #c98a00; }
  #lrg-warnbox p { margin: 0 0 6px; color: #8a5a00; font-size: 0.9em; }
  #lrg-warnbox p:last-child { margin-bottom: 0; }
  @media (prefers-color-scheme: dark) { #lrg-warnbox p { color: #e0ab3d; } }
</style>

<div class="field">
  <label for="lrg-paths">対象パス（1行に1つ。glob可）</label>
  <textarea id="lrg-paths" rows="3" spellcheck="false">/var/log/nginx/*.log</textarea>
</div>

<div class="field">
  <label for="lrg-name">設定ファイル名（/etc/logrotate.d/ 配下、拡張子なし）</label>
  <input type="text" id="lrg-name" autocomplete="off" spellcheck="false" value="nginx">
</div>

<div class="row">
  <div class="field">
    <label for="lrg-period">ローテーション周期</label>
    <select id="lrg-period">
      <option value="daily" selected>daily（毎日）</option>
      <option value="weekly">weekly（毎週）</option>
      <option value="monthly">monthly（毎月）</option>
      <option value="size">size（サイズ指定）</option>
    </select>
  </div>
  <div class="field" id="lrg-size-field">
    <label for="lrg-size">サイズ（例: 100k / 100M / 1G）</label>
    <input type="text" id="lrg-size" autocomplete="off" spellcheck="false" placeholder="100M">
  </div>
  <div class="field">
    <label for="lrg-rotate">保持世代数（rotate）</label>
    <input type="text" inputmode="numeric" id="lrg-rotate" value="14">
  </div>
</div>

<div class="row">
  <label class="check"><input type="checkbox" id="lrg-compress" checked> compress（gzip圧縮）</label>
  <label class="check"><input type="checkbox" id="lrg-delaycompress"> delaycompress（1世代遅らせて圧縮）</label>
  <label class="check"><input type="checkbox" id="lrg-missingok" checked> missingok（対象が無くてもエラーにしない）</label>
  <label class="check"><input type="checkbox" id="lrg-notifempty" checked> notifempty（空なら回さない）</label>
  <label class="check"><input type="checkbox" id="lrg-copytruncate"> copytruncate（コピーして元ファイルを空に）</label>
</div>

<div class="row">
  <label class="check"><input type="checkbox" id="lrg-create" checked> create（新規ファイルを作成）</label>
  <div class="field">
    <label for="lrg-create-mode">モード（例: 0640）</label>
    <input type="text" id="lrg-create-mode" autocomplete="off" spellcheck="false" value="0640">
  </div>
  <div class="field">
    <label for="lrg-create-owner">所有者</label>
    <input type="text" id="lrg-create-owner" autocomplete="off" spellcheck="false" value="www-data">
  </div>
  <div class="field">
    <label for="lrg-create-group">グループ</label>
    <input type="text" id="lrg-create-group" autocomplete="off" spellcheck="false" value="adm">
  </div>
</div>

<div class="row">
  <label class="check"><input type="checkbox" id="lrg-dateext"> dateext（世代番号でなく日付でファイル名を付ける）</label>
  <div class="field">
    <label for="lrg-dateformat">dateformat（省略時はlogrotateの既定 -%Y%m%d）</label>
    <input type="text" id="lrg-dateformat" autocomplete="off" spellcheck="false" placeholder="-%Y%m%d">
  </div>
</div>

<div class="field">
  <label for="lrg-postrotate">postrotate スクリプト（1行に1コマンド。空なら出力しない）</label>
  <textarea id="lrg-postrotate" rows="2" spellcheck="false">systemctl reload nginx</textarea>
</div>
<label class="check"><input type="checkbox" id="lrg-sharedscripts" checked> sharedscripts（複数パスにマッチしてもpostrotateは1回だけ実行）</label>

<p class="error" id="lrg-error"></p>
<div class="result" id="lrg-warnbox" hidden></div>

<div class="result">
  <p class="hint" style="margin:0 0 6px">生成された設定（配置先: <span id="lrg-path" class="mono">/etc/logrotate.d/nginx</span>）</p>
  <pre class="mono" id="lrg-output"></pre>
  <div class="actions">
    <button type="button" class="copy-btn" data-copy-target="lrg-output">設定内容をコピー</button>
  </div>
</div>
<p class="hint">生成されるのは設定ファイルの中身だけです。実際の配置（<code>/etc/logrotate.d/</code>への保存）や動作確認（<code>logrotate -d</code>）はサーバー上で行ってください。このツールはブラウザ内で完結し、どこにも送信しません。</p>
