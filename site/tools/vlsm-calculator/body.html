<div class="field">
  <label for="vc-parent">親ネットワーク（CIDR表記）</label>
  <input type="text" id="vc-parent" inputmode="numeric" autocomplete="off" spellcheck="false" value="192.168.10.0/24">
</div>
<div class="field">
  <label for="vc-reqs">必要ホスト数リスト（1行に「名前 数値」）</label>
  <textarea id="vc-reqs" rows="6" class="mono" data-example>営業 60
開発 28
管理 12
WAN 2</textarea>
</div>
<div class="check">
  <label><input type="checkbox" id="vc-allow-small"> 必要ホスト数が1・2の行は /32・/31 を使う（RFC 3021 の P2Pリンクなど）</label>
</div>
<p class="error" id="vc-error"></p>
<div class="result">
  <p id="vc-summary" class="hint"></p>
  <table id="vc-table" hidden>
    <thead><tr><th>名前</th><th>要求</th><th>CIDR</th><th>ネットワーク</th><th>ブロードキャスト</th><th>使用可能範囲</th><th>マスク</th><th>使用可能数</th><th>余り</th></tr></thead>
    <tbody id="vc-rows"></tbody>
  </table>
</div>
<div class="result">
  <p id="vc-leftover-summary" class="hint"></p>
  <table id="vc-leftover-table" hidden>
    <thead><tr><th>未割当のCIDR</th></tr></thead>
    <tbody id="vc-leftover-rows"></tbody>
  </table>
</div>
<p class="hint">必要ホスト数が大きい行から先に、最小のブロックサイズで親ネットワークの先頭から順に割り当てます。使用可能ホスト数は既定で 2^(32-prefix)-2（ネットワークアドレスとブロードキャストを除く）。途中で収まらなくなった行は、不足しているアドレス数を表示します。</p>
