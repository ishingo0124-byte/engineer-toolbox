<div class="field">
  <label>西暦 → 和暦</label>
  <div class="row">
    <div class="field">
      <label for="wc-gy">年（西暦）</label>
      <input type="text" id="wc-gy" inputmode="numeric" autocomplete="off" value="2019">
    </div>
    <div class="field">
      <label for="wc-gm">月（空欄可）</label>
      <input type="text" id="wc-gm" inputmode="numeric" autocomplete="off" value="5" placeholder="任意">
    </div>
    <div class="field">
      <label for="wc-gd">日（空欄可）</label>
      <input type="text" id="wc-gd" inputmode="numeric" autocomplete="off" value="1" placeholder="任意">
    </div>
  </div>
  <p class="hint">月・日を空欄にすると年単位の変換になります。改元の年は和暦が2通りになることがあります。</p>
  <div class="result" id="wc-g2w-result"></div>
  <p class="error" id="wc-g2w-error"></p>
</div>

<div class="field" style="margin-top:20px">
  <label>和暦 → 西暦</label>
  <div class="row">
    <div class="field">
      <label for="wc-era">元号</label>
      <select id="wc-era">
        <option value="明治">明治</option>
        <option value="大正">大正</option>
        <option value="昭和">昭和</option>
        <option value="平成">平成</option>
        <option value="令和" selected>令和</option>
      </select>
    </div>
    <div class="field">
      <label for="wc-wy">年（元年は 1 または「元年」）</label>
      <input type="text" id="wc-wy" autocomplete="off" value="元年">
    </div>
    <div class="field">
      <label for="wc-wm">月（空欄可）</label>
      <input type="text" id="wc-wm" inputmode="numeric" autocomplete="off" value="5" placeholder="任意">
    </div>
    <div class="field">
      <label for="wc-wd">日（空欄可）</label>
      <input type="text" id="wc-wd" inputmode="numeric" autocomplete="off" value="1" placeholder="任意">
    </div>
  </div>
  <div class="result" id="wc-w2g-result"></div>
  <p class="error" id="wc-w2g-error"></p>
</div>

<p class="hint">明治6年1月1日（1873-01-01）より前は太陰太陽暦（旧暦）のため対象外です。対応範囲は明治6年以降になります。</p>
