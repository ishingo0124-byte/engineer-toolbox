<style>
  .hha-list { border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; margin: 0 0 14px; }
  .hha-tbl { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  .hha-tbl th, .hha-tbl td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .hha-tbl th { background: var(--soft); }
  .hha-tbl tr:last-child td { border-bottom: none; }
  .hha-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; white-space: nowrap; }
  .hha-val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  .hha-check { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 8px; }
  .hha-check .hha-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hha-badge { font-size: 0.76em; padding: 2px 10px; border-radius: 999px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
  .hha-badge.s-ok { background: #0a7a3d22; color: var(--ok); border-color: var(--ok); }
  .hha-badge.s-warn { background: #b8860022; color: #a06a00; border-color: #a06a00; }
  .hha-badge.s-missing { background: var(--soft); color: var(--muted); border-color: var(--line); }
  .hha-badge.s-bad { background: #c6282822; color: var(--err); border-color: var(--err); }
  .hha-check p { margin: 6px 0 0; font-size: 0.92em; }
  .hha-check .hha-rec { color: var(--muted); font-size: 0.86em; }
  .hha-leak { border: 1px solid var(--err); border-radius: 10px; padding: 10px 14px; margin: 0 0 8px; }
  .hha-empty { color: var(--muted); font-size: 0.9em; }
</style>
<div class="field">
  <label for="hha-input">HTTPレスポンスヘッダー（curl -I / DevToolsの出力を貼り付け）</label>
  <textarea id="hha-input" rows="10" spellcheck="false" placeholder="例: curl -I https://example.com/ の出力をそのまま貼り付けます">HTTP/2 200
date: Tue, 10 Sep 2026 03:12:00 GMT
content-type: text/html; charset=UTF-8
server: nginx/1.18.0 (Ubuntu)
x-powered-by: PHP/8.1.2
strict-transport-security: max-age=15552000; includeSubDomains
x-content-type-options: nosniff
referrer-policy: no-referrer-when-downgrade
set-cookie: session_id=abc123def456; Path=/; HttpOnly
cache-control: public, max-age=3600</textarea>
</div>
<p id="hha-error" class="error"></p>

<h3 class="hint" style="margin:14px 0 4px">検出されたレスポンスヘッダー（<span id="hha-count">0</span>件）</h3>
<div class="hha-list"><table class="hha-tbl" id="hha-table"><thead><tr><th>ヘッダー名</th><th>値</th><th>意味</th></tr></thead><tbody></tbody></table></div>

<h3 class="hint" style="margin:14px 0 4px">セキュリティヘッダー チェックリスト</h3>
<div id="hha-checklist"></div>

<h3 class="hint" style="margin:14px 0 4px">情報漏えいの可能性があるヘッダー</h3>
<div id="hha-leaks"></div>

<div class="actions">
  <button type="button" id="hha-clear" class="ghost">クリア</button>
</div>
