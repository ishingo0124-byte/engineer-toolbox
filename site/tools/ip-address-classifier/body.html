<div class="field">
  <label for="ic-input">IPv4 / IPv6 アドレス（1行に1つ）</label>
  <textarea id="ic-input" rows="7" data-example="1">192.168.1.10
100.64.0.1
203.0.113.5
::1
fe80::1
::ffff:203.0.113.5
8.8.8.8</textarea>
</div>
<p class="error" id="ic-error"></p>
<dl class="result-grid" id="ic-list"></dl>
<p class="hint">分類はIANAの Special-Purpose Address Registry（RFC 6890 ほか）に基づく簡易判定です。ファイアウォールやルーティングの都合で、実際の到達可否とは異なる場合があります。</p>
