<div class="field">
  <label for="shh-birth">生まれ年、または生年月日（西暦 例:2023 / 2023-06-10　和暦 例:令和5年6月10日）</label>
  <input type="text" id="shh-birth" autocomplete="off" value="2023-06-10" data-example="2023-06-10">
</div>
<p class="error" id="shh-error"></p>
<div class="result" id="shh-result" style="overflow-x:auto"></div>
<p class="hint" id="shh-note"></p>
<p class="hint">3歳は男女とも、5歳は男の子、7歳は女の子で祝う家庭が多いとされますが、地域や家庭によって違います。日取りは11月15日が目安で、前後の週末に行う家庭もあります。</p>

<p style="margin:24px 0 6px"><strong>生まれ年別の七五三の早見表（満年齢・数え年の両方）</strong></p>
<div id="shh-table-wrap"></div>
<p class="hint">「満」は誕生日を迎えて満3・5・7歳になる年、「数え」は生まれた年を1歳とし元日に加齢する数え方でその歳になる年です。</p>
