<div class="field">
  <label for="hc-birth">お子さんの生年月日（「2022-06-15」または「令和4年6月15日」の形式）</label>
  <input type="text" id="hc-birth" autocomplete="off" value="2022-06-15" data-example="2022-06-15">
</div>
<p class="hint">クラスは「その年度の4月1日時点の満年齢」で決まります。4月1日生まれの子は、前の学年に入ります。</p>
<p class="error" id="hc-error"></p>
<div class="result" id="hc-result"></div>

<div class="field" style="margin-top:20px">
  <label>年度ごとのクラス</label>
  <div id="hc-table"></div>
  <p class="hint" id="hc-note"></p>
</div>
